<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UASS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="role-selection.css">
</head>
<body>

  <div class="box">

    <div class="logo">
      <svg width="140" height="140" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6c63ff"/>
            <stop offset="100%" stop-color="#3a3a8f"/>
          </linearGradient>

          <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <circle cx="120" cy="120" r="100" fill="url(#bgGradient)"/>
        <circle cx="120" cy="120" r="90" stroke="white" stroke-opacity="0.2" stroke-width="2" fill="none"/>

        <g filter="url(#glow)">
          <polygon points="70,100 120,70 170,100 120,130" fill="white"/>
          <rect x="95" y="130" width="50" height="8" fill="white"/>
        </g>

        <line x1="80" y1="150" x2="160" y2="150" stroke="white" stroke-opacity="0.3"/>
        <line x1="90" y1="160" x2="150" y2="160" stroke="white" stroke-opacity="0.2"/>

        <text x="50%" y="200" text-anchor="middle" fill="white" font-size="16">
          UASS
        </text>
      </svg>
    </div>

    <h1>Choose Your Account Type</h1>

    <button class="role-btn" onclick="selectRole('student')">
      <span class="emoji">🎓</span>
      Student
    </button>

    <button class="role-btn" onclick="selectRole('instructor')">
      <span class="emoji">👨‍🏫</span>
      Instructor
    </button>

    <button class="role-btn" onclick="selectRole('admin')">
      <span class="emoji">⚙️</span>
      Admin
    </button>

  </div>

  <script>
    function selectRole(role) {
      localStorage.setItem("userRole", role);

      if (role === "student") {
        window.location.href = "student.html";
      } else if (role === "instructor") {
        window.location.href = "instructor.html";
      } else {
        window.location.href = "admin.html";
      }
    }
  </script>

</body>
</html>
