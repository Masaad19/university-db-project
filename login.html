<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UASS - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<header class="header">

<div class="logo">

    <div class="logo-svg">

        <svg width="70" height="70" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">

            <defs>
                <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#6c63ff"/>
                    <stop offset="100%" stop-color="#3a3a8f"/>
                </linearGradient>

                <filter id="glow">
                    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <circle cx="120" cy="120" r="100" fill="url(#bgGradient)"/>

            <circle
                cx="120"
                cy="120"
                r="90"
                stroke="white"
                stroke-opacity="0.2"
                stroke-width="2"
                fill="none"
            />

            <g filter="url(#glow)">
                <polygon points="70,100 120,70 170,100 120,130" fill="white"/>
                <rect x="95" y="130" width="50" height="8" fill="white"/>
            </g>

            <line x1="80" y1="150" x2="160" y2="150" stroke="white" stroke-opacity="0.3"/>
            <line x1="90" y1="160" x2="150" y2="160" stroke="white" stroke-opacity="0.2"/>

            <text
                x="50%"
                y="200"
                text-anchor="middle"
                fill="white"
                font-size="16"
                font-family="Segoe UI, Arial"
            >
                UASS
            </text>

        </svg>

    </div>

    <span>UASS</span>

</div>

    <nav class="nav">
        <ul>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>

</header>

<hr>

<div class="container">

    <div class="box">
        <h2>Login</h2>

        <form onsubmit="goToRole(event)">

            <div class="inputBox">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="inputBox">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <div class="inputBox">
                <button type="submit">Sign In</button>
            </div>

        </form>

        <p class="forget">
            Forgot Password? <a href="#">Click Here</a>
        </p>

    </div>

</div>

<script>
function goToRole(event) {
    event.preventDefault();

    let username = document.getElementById("username").value;

    localStorage.setItem("username", username);

    window.location.href = "role-selection.html";
}
</script>

</body>
</html>
